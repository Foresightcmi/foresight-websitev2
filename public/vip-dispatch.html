<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Under Contract Due Diligence Dispatch - Foresight Home Inspections</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2e;
      --card-border: #232f48;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --accent-purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px;
      padding-bottom: 90px;
      max-width: 680px;
      margin: 0 auto;
    }
    .header {
      position: sticky;
      top: 0;
      background: rgba(11, 15, 25, 0.98);
      backdrop-filter: blur(14px);
      padding: 10px 0 8px 0;
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
      margin-bottom: 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title span { color: var(--accent-gold); }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* VIP Realtor Portal Link Button in Header */
    .realtor-portal-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      text-decoration: none;
      color: #fff;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .realtor-portal-banner:hover, .realtor-portal-banner:active {
      border-color: var(--accent-gold);
      background: rgba(30, 41, 59, 1);
    }
    .realtor-portal-banner .gold-text {
      color: var(--accent-gold);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .realtor-portal-banner .arrow-tag {
      background: var(--accent-gold);
      color: #000;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
    }

    /* Progress Stats Bar */
    .stats-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .stat-numbers { font-size: 14px; font-weight: 800; color: #fff; }
    .stat-numbers .highlight { color: var(--accent-green); }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #0d1322;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Search & Filter Controls */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .search-input {
      width: 100%;
      background: #0d1322;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent-gold); }
    .select-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .select-ctrl {
      width: 100%;
      background: #0d1322;
      border: 1px solid var(--card-border);
      color: #f3f4f6;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      outline: none;
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      gap: 4px;
      background: #111827;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      margin-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .tab-btn.active.uncontacted {
      background: #1e3a8a;
      color: #93c5fd;
    }
    .tab-btn.active.contacted {
      background: #064e3b;
      color: #6ee7b7;
    }
    .tab-btn.active.all {
      background: var(--card-border);
      color: #fff;
    }

    .filter-notice {
      background: rgba(16, 185, 129, 0.1);
      border-left: 3px solid var(--accent-green);
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 11.5px;
      color: #a7f3d0;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .card.sent {
      border-color: rgba(16, 185, 129, 0.5);
      background: #0d1e1a;
      opacity: 0.9;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .agent-name {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-brokerage {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.3;
    }
    .badge-date {
      background: #1f293d;
      color: #93c5fd;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 5px;
      white-space: nowrap;
    }
    .badge-price {
      background: #064e3b;
      color: #34d399;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 5px;
      margin-left: 4px;
    }
    .property-box {
      background: #0d1322;
      border-left: 3px solid var(--accent-red);
      padding: 7px 10px;
      border-radius: 4px;
      margin: 8px 0;
      font-size: 12px;
    }
    .prop-addr { font-weight: 700; color: #fff; }
    .prop-city { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

    /* SMS Preview Box */
    .preview-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 7px;
      padding: 8px 10px;
      margin: 8px 0;
      font-size: 11.5px;
      color: #e2e8f0;
      line-height: 1.45;
    }
    .preview-tag {
      color: var(--accent-blue);
      font-weight: 800;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .preview-box a {
      color: #60a5fa;
      text-decoration: underline;
      font-weight: 700;
    }

    /* Status Banner */
    .sent-status-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-green);
      color: #6ee7b7;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin: 8px 0;
    }
    .btn-toggle-unsent {
      background: transparent;
      border: 1px solid #6ee7b7;
      color: #6ee7b7;
      font-size: 10.5px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Action Buttons */
    .btn-primary-sms {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 800;
      padding: 12px 14px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      border: none;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-primary-sms:active {
      transform: scale(0.98);
      background: #047857;
    }
    .btn-primary-sms.sent {
      background: #1b2e26;
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: none;
    }

    .btn-action-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      margin-top: 6px;
    }
    .btn-buyer-pass {
      background: #1e3a8a;
      color: #93c5fd;
      border: 1px solid #3b82f6;
      padding: 8px 10px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 6px;
      text-decoration: none;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-buyer-pass:active { background: #172554; }
    .btn-call {
      background: #1f293d;
      color: #60a5fa;
      border: 1px solid #3b82f6;
      padding: 8px 12px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 6px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-mark-toggle {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-mark-toggle:hover {
      background: #334155;
      color: #fff;
    }

    .load-more-btn {
      width: 100%;
      padding: 12px;
      background: #1f293d;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      border-radius: 8px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      padding: 40px 15px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>

    // State Persistence across localStorage
    const STORAGE_KEY = 'foresight_due_diligence_sent_v1';
    let sentMap = {}; // { cardId: timestamp }

    try {
      const loaded = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      if (typeof loaded === 'object' && loaded !== null && !Array.isArray(loaded)) {
        sentMap = loaded;
      }
      // Also migrate from legacy array if present
      const legacy = localStorage.getItem('foresight_sent_sms');
      if (legacy) {
        try {
          const arr = JSON.parse(legacy);
          if (Array.isArray(arr)) {
            arr.forEach(id => {
              if (id && !sentMap[id]) sentMap[id] = 'Sent previously';
            });
          }
        } catch(e) {}
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sentMap));
    } catch(e) {
      console.warn('Storage error', e);
    }

    let currentTab = 'uncontacted';
    let currentCity = 'ALL';
    let currentSort = 'date_desc';
    let searchQuery = '';
    let displayLimit = 60;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sentMap));
      } catch(e) {}
    }

    function isSent(id) {
      return Boolean(sentMap[id]);
    }

    function markSent(id, smsLink) {
      const nowStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      sentMap[id] = 'Sent ' + nowStr;
      saveState();
      renderStats();
      renderCards();
      if (smsLink) {
        window.location.href = smsLink;
      }
    }

    function toggleSent(id) {
      if (sentMap[id]) {
        delete sentMap[id];
      } else {
        const nowStr = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        sentMap[id] = 'Sent ' + nowStr;
      }
      saveState();
      renderStats();
      renderCards();
    }

    function setTab(tab) {
      currentTab = tab;
      document.getElementById('tabUncontacted').className = 'tab-btn' + (tab === 'uncontacted' ? ' active uncontacted' : '');
      document.getElementById('tabContacted').className = 'tab-btn' + (tab === 'contacted' ? ' active contacted' : '');
      document.getElementById('tabAll').className = 'tab-btn' + (tab === 'all' ? ' active all' : '');
      
      const notice = document.getElementById('filterNotice');
      if (tab === 'uncontacted') {
        notice.innerHTML = 'Showing <b>uncontacted under-contract agents</b>. Tapping opens native SMS and marks as sent.';
      } else if (tab === 'contacted') {
        notice.innerHTML = 'Showing <b>contacted agents</b>. Timestamp shown below.';
      } else {
        notice.innerHTML = 'Showing <b>all active under-contract agents</b>.';
      }
      displayLimit = 60;
      renderCards();
    }

    function setCity(city) {
      currentCity = city;
      displayLimit = 60;
      renderCards();
    }

    function setSort(sort) {
      currentSort = sort;
      renderCards();
    }

    function handleSearch(val) {
      searchQuery = (val || '').toLowerCase().trim();
      displayLimit = 60;
      renderCards();
    }

    function loadMore() {
      displayLimit += 60;
      renderCards();
    }

    function populateCityFilter() {
      const cityCounts = {};
      underContractFilers.forEach(c => {
        const city = c.city ? c.city.trim() : 'Metro Atlanta';
        cityCounts[city] = (cityCounts[city] || 0) + 1;
      });

      const select = document.getElementById('citySelect');
      const sortedCities = Object.keys(cityCounts).sort((a,b) => cityCounts[b] - cityCounts[a]);
      
      select.innerHTML = '<option value="ALL">📍 All Cities (' + underContractFilers.length.toLocaleString() + ')</option>' +
        sortedCities.map(city => '<option value="' + city + '">' + city + ' (' + cityCounts[city] + ')</option>').join('');
    }

    function renderStats() {
      const total = underContractFilers.length;
      let sentCount = 0;
      underContractFilers.forEach(c => {
        if (isSent(c.id)) sentCount++;
      });
      const uncontactedCount = total - sentCount;

      document.getElementById('sentCountDisplay').textContent = sentCount.toLocaleString();
      document.getElementById('totalCountDisplay').textContent = total.toLocaleString();
      document.getElementById('uncontactedTabCount').textContent = uncontactedCount.toLocaleString();
      document.getElementById('contactedTabCount').textContent = sentCount.toLocaleString();
      document.getElementById('allTabCount').textContent = total.toLocaleString();

      const pct = Math.round((sentCount / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      let filtered = underContractFilers;

      // 1. Tab filter
      if (currentTab === 'uncontacted') {
        filtered = filtered.filter(c => !isSent(c.id));
      } else if (currentTab === 'contacted') {
        filtered = filtered.filter(c => isSent(c.id));
      }

      // 2. City filter
      if (currentCity !== 'ALL') {
        filtered = filtered.filter(c => (c.city || '').trim() === currentCity);
      }

      // 3. Search query
      if (searchQuery) {
        filtered = filtered.filter(c => 
          (c.name && c.name.toLowerCase().includes(searchQuery)) ||
          (c.city && c.city.toLowerCase().includes(searchQuery)) ||
          (c.address && c.address.toLowerCase().includes(searchQuery)) ||
          (c.phone && c.phone.includes(searchQuery)) ||
          (c.brokerage && c.brokerage.toLowerCase().includes(searchQuery))
        );
      }

      // 4. Sort
      filtered.sort((a, b) => {
        if (currentSort === 'price_desc') {
          return (b.raw_price || 0) - (a.raw_price || 0);
        } else if (currentSort === 'city_asc') {
          const cCmp = (a.city || '').localeCompare(b.city || '');
          if (cCmp !== 0) return cCmp;
          return (a.name || '').localeCompare(b.name || '');
        } else if (currentSort === 'name_asc') {
          return (a.name || '').localeCompare(b.name || '');
        } else {
          const dCmp = (b.date || '').localeCompare(a.date || '');
          if (dCmp !== 0) return dCmp;
          return (b.raw_price || 0) - (a.raw_price || 0);
        }
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>🎉 No Under-Contract Listings Found</h3>
            <p style="margin-top:6px; font-size:12px;">Try adjusting your search query, city filter, or tab selection.</p>
          </div>
        `;
        return;
      }

      const totalMatches = filtered.length;
      const displayBatch = filtered.slice(0, displayLimit);

      const html = displayBatch.map(f => {
        const sent = isSent(f.id);
        const sentTime = sentMap[f.id] || 'Sent';

        // Dynamically synthesize text and links
        const textBody = 'Hi ' + f.first + ', Christopher Boykin with Foresight Home Inspections here! Saw ' + f.address + ' in ' + f.city + ' is under contract—congratulations! If your buyers or co-op agent need a rapid 24-hr due diligence inspection with our two-inspector team, active SUPRA eKEY access, and our 1-click GAR Form F404 repair addendum tool, we have a slot open in ' + f.city + ' this week. Best wishes on a smooth closing! — (678) 480-2110 | https://fhinspectionsatl.com/realtors';
        const smsLink = 'sms:+1' + f.clean_phone + '?&body=' + encodeURIComponent(textBody);

        const buyerBody = 'Hi ' + f.first + ', here is our 1-click due diligence scheduler and $35,000 warranty certificate for your buyers at ' + f.address + ': https://fhinspectionsatl.com/quote?prop=' + encodeURIComponent(f.address) + ' — Includes our two-inspector team, same-day report, and free utility setup concierge. Feel free to pass this directly to your buyers so they can lock in their inspection date today!';
        const buyerLink = 'sms:+1' + f.clean_phone + '?&body=' + encodeURIComponent(buyerBody);

        return `
          <div class="card ${sent ? 'sent' : ''}" id="${f.id}">
            <div class="card-top">
              <div>
                <div class="agent-name">👤 ${f.name}</div>
                <div class="agent-brokerage">${f.brokerage || 'Real Estate Professional'}</div>
              </div>
              <div>
                <span class="badge-date">📅 ${f.date || ''}</span>
                ${f.price ? `<span class="badge-price">${f.price}</span>` : ''}
              </div>
            </div>

            <div class="property-box">
              <div class="prop-addr">📍 ${f.address || 'Property Under Contract'}</div>
              <div class="prop-city">${f.city ? f.city + ', GA • ' : ''}${f.phone}</div>
            </div>

            <!-- Due Diligence Message Preview -->
            <div class="preview-box">
              <div class="preview-tag">⚡ Under Contract Due Diligence SMS:</div>
              "${textBody.replace('https://fhinspectionsatl.com/realtors', '<a href="https://fhinspectionsatl.com/realtors" target="_blank">fhinspectionsatl.com/realtors</a>')}"
            </div>

            ${sent ? `
              <div class="sent-status-banner">
                <span>✓ ${sentTime}</span>
                <button class="btn-toggle-unsent" onclick="toggleSent('${f.id}')">Mark Unsent</button>
              </div>
            ` : ''}

            <!-- Primary Action: 1-Tap Due Diligence SMS -->
            <button class="btn-primary-sms ${sent ? 'sent' : ''}" onclick="markSent('${f.id}', '${smsLink}')">
              ${sent ? '✓ Resend Due Diligence SMS (' + f.phone + ')' : '📱 1-Tap Due Diligence Text ' + f.first + ' (' + f.phone + ')'}
            </button>

            <!-- Secondary Actions: Buyer Forward Pass & Call -->
            <div class="btn-action-row">
              <a class="btn-buyer-pass" href="${buyerLink}">
                📲 1-Tap Buyer Forward Pass
              </a>
              <a class="btn-call" href="tel:${f.clean_phone}">
                📞 Call
              </a>
              <button class="btn-mark-toggle" onclick="toggleSent('${f.id}')">
                ${sent ? 'Unsent' : '✓ Sent'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      let footerHtml = '';
      if (totalMatches > displayLimit) {
        footerHtml = `
          <button class="load-more-btn" onclick="loadMore()">
            ⬇️ Load Next 60 Contacts (Showing ${displayLimit} of ${totalMatches.toLocaleString()})
          </button>
        `;
      }

      container.innerHTML = html + footerHtml;
    }

    // Init
    populateCityFilter();
    renderStats();
    renderCards();
  </script>
