name: City Page Refresher

on:
  schedule:
    # Spread across 3 days: Tuesday, Thursday, Saturday
    # Each run refreshes only 3 cities to conserve tokens
    - cron: '0 15 * * 2'   # Tuesday 11 AM EST
    - cron: '0 16 * * 4'   # Thursday 12 PM EST
    - cron: '0 14 * * 6'   # Saturday 10 AM EST
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-cities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Closed-Loop SEO Governor Gate & Priority Cities
        env:
          GCP_SA_JSON: ${{ secrets.GCP_ANALYTICS_SA_JSON }}
        run: |
          if [ -n "$GCP_SA_JSON" ]; then
            python3 -m pip install --quiet --break-system-packages google-auth httpx || pip install --quiet google-auth httpx
            printf '%s' "$GCP_SA_JSON" > .analytics/service-account.json
            python3 .agents/skills/traffic-intelligence/scripts/autonomous_seo_governor.py --workspace . govern
            rm -f .analytics/service-account.json
          fi

      - name: Refresh city pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/refresh-city-pages.mjs

      - name: Commit, push, and ping IndexNow
        run: |
          git config user.name "Foresight City Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/cities.json data/refresh-log.json .analytics/experiments_ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "refresh: city updates $(date +%Y-%m-%d) [skip actions]"
            git pull --rebase -X theirs origin main
            git push origin main
            node scripts/ping-indexnow.mjs
          else
            echo "Clean"
          fi
