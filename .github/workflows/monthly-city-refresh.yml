name: City Page Refresher

on:
  schedule:
    # Spread across 3 days: Tuesday, Thursday, Saturday
    # Each run refreshes only 3 cities to conserve tokens
    - cron: '0 15 * * 2'   # Tuesday 11 AM EST
    - cron: '0 16 * * 4'   # Thursday 12 PM EST
    - cron: '0 14 * * 6'   # Saturday 10 AM EST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh city pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/refresh-city-pages.mjs

      - name: Ping Google Sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://www.fhinspectionsatl.com/sitemap.xml"
          echo "Google sitemap pinged"

      - name: Commit and push
        run: |
          git config user.name "Foresight City Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/cities.json data/refresh-log.json
          git diff --cached --quiet || (git commit -m "refresh: city updates $(date +%Y-%m-%d)" && git push)
