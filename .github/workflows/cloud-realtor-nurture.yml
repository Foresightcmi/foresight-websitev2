name: Cloud Realtor Nurture Campaign (24/7 Cloud + PC-Aware Auto-Takeover)

on:
  schedule:
    # Runs at 10:15 AM, 1:15 PM, and 4:15 PM EST (15:15, 18:15, 21:15 UTC).
    # Automatically checks [Gmail]/Sent Mail via IMAP: stands down if local PC is active today,
    # and automatically dispatches Realtor nurture emails in the cloud when PC is off.
    - cron: '15 15,18,21 * * *'
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cloud-realtor-nurture:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan Inbox for Opt-Out Replies Before Sending
        run: node scripts/cloud-imap-unsubscribe-guard.mjs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER || 'inspect@foresightcmi.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Execute Cloud Realtor Nurture Pulse
        run: node scripts/cloud-realtor-nurture-pulse.mjs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER || 'inspect@foresightcmi.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Commit and Push Cloud Nurture State
        run: |
          git config user.name "Foresight Cloud Nurture Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/unsubscribed_contacts.json data/cloud-realtor-nurture-state.json
          git diff --cached --quiet || (git commit -m "chore(nurture): cloud realtor nurture pulse state sync [skip ci]" && git pull --rebase -X theirs origin main && git push origin main) || echo "Clean"
