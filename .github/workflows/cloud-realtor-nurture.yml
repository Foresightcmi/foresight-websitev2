name: Cloud Realtor Nurture Campaign (Manual PC-Off Vacation Backup)

on:
  # Scheduled cron retired so cloud pulses never double-email Realtors already
  # handled daily at 9:00 AM by local Windows Task Antigravity_Daily_Email_Campaign.
  # Trigger manually via workflow_dispatch only when local workstation is powered off.
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cloud-realtor-nurture:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan Inbox for Opt-Out Replies Before Sending
        run: node scripts/cloud-imap-unsubscribe-guard.mjs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER || 'inspect@foresightcmi.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Execute Cloud Realtor Nurture Pulse
        run: node scripts/cloud-realtor-nurture-pulse.mjs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER || 'inspect@foresightcmi.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Commit and Push Cloud Nurture State
        run: |
          git config user.name "Foresight Cloud Nurture Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/unsubscribed_contacts.json data/cloud-realtor-nurture-state.json
          git diff --cached --quiet || (git commit -m "chore(nurture): cloud realtor nurture pulse state sync [skip ci]" && git pull --rebase -X theirs origin main && git push origin main) || echo "Clean"
