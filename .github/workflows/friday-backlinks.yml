name: Friday — Backlink Scout

on:
  schedule:
    # Every Friday at 11:00 AM EST (15:00 UTC)
    - cron: '0 15 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout-backlinks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scout backlink & digital PR opportunities
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/scout-backlinks.mjs
          node scripts/digital-pr-scout.mjs
          python scripts/realtor_partner_engine.py

      - name: Commit and push
        run: |
          git config user.name "Foresight Backlink Scout"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/backlink-opportunities.json data/pr-pitches-ready.json data/pr-dispatch-brief.md data/realtor-outreach-campaign.json data/realtor-dispatch-brief.md
          git diff --cached --quiet || (git commit -m "scout: backlink & digital PR opportunities $(date +%Y-%m-%d) [skip ci]" && git push)
