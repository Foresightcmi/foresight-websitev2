name: Autonomous Social & GBP Broadcast Engine (24/7 Cloud + PC-Aware Fallback)

on:
  schedule:
    # Runs daily at 11:20 AM EST (16:20 UTC). Automatically checks if local PC already
    # published today's 10:30 AM social batch; if PC is off, runs cloud broadcast + ntfy push.
    - cron: '20 16 * * *'
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  broadcast-social-post:
    name: Manual Fallback — Rotate LinkedIn, GBP & Facebook Copy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Cloud Social & GBP Engine When Local PC Is Off
        run: |
          node -e '
            import("node:fs").then(({ default: fs }) => {
              const p = "data/chief-of-staff-social-status.json";
              const today = new Date().toISOString().slice(0, 10);
              if (fs.existsSync(p) && process.env.GITHUB_EVENT_NAME === "schedule") {
                const st = JSON.parse(fs.readFileSync(p, "utf8"));
                if ((st.lastRunAt || "").startsWith(today) && (st.publishedPlatforms || []).length > 0) {
                  console.log("Local PC already published today (" + st.publishedPlatforms.length + " platforms). Skipping duplicate cloud push.");
                  process.exit(0);
                }
              }
            });
          ' || exit 0
          node -e '
            import("node:fs").then(async ({ default: fs }) => {
              const p = "data/chief-of-staff-social-status.json";
              const today = new Date().toISOString().slice(0, 10);
              if (fs.existsSync(p) && process.env.GITHUB_EVENT_NAME === "schedule") {
                const st = JSON.parse(fs.readFileSync(p, "utf8"));
                if ((st.lastRunAt || "").startsWith(today) && (st.publishedPlatforms || []).length > 0) return;
              }
              const { spawnSync } = await import("node:child_process");
              spawnSync(process.execPath, ["scripts/linkedin-content-engine.mjs", "--push"], { stdio: "inherit" });
            });
          '

      - name: Commit and Push Updated Social State & Logs
        run: |
          git config --global user.name "Foresight Social Bot"
          git config --global user.email "social-bot@fhinspectionsatl.com"
          git add data/social-logs/ data/
          git diff --cached --quiet || (git commit -m "chore(social): manual LinkedIn copy rotation [skip ci]" && git pull --rebase -X theirs origin main && git push origin main) || echo "No state changes to commit."
