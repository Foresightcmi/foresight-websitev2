name: Autonomous Social & GBP Broadcast Engine

on:
  schedule:
    # Run every weekday Monday through Friday at 2:00 PM UTC (10:00 AM EST) - Tobi Oluwole Rule #1
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    # Allows manual 1-click publishing from GitHub Actions tab

permissions:
  contents: write

jobs:
  broadcast-social-post:
    name: Rotate & Publish to LinkedIn, GBP & Facebook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute LinkedIn Content Engine (Tobi Oluwole & Josh Sanders Standard)
        run: node scripts/linkedin-content-engine.mjs

      - name: Execute Multi-Channel Publisher (GBP + Facebook)
        run: node scripts/multi-channel-publisher.mjs

      - name: Commit and Push Updated Social State & Logs
        run: |
          git config --global user.name "Foresight Social Bot"
          git config --global user.email "social-bot@fhinspectionsatl.com"
          git add data/social-logs/ data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(social): autonomous 10 AM weekday LinkedIn & multi-channel rotation [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
