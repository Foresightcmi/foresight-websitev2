name: Autonomous Social & GBP Broadcast Engine (Manual Backup Only)

on:
  # Scheduled cron retired: daily native video + 5-slide editorial carousels are now
  # auto-published locally via omni-video-publisher (10:30 AM & 2:30 PM Windows Tasks).
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  broadcast-social-post:
    name: Manual Fallback — Rotate LinkedIn, GBP & Facebook Copy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute LinkedIn Content Engine (Manual Trigger)
        run: node scripts/linkedin-content-engine.mjs --push

      - name: Commit and Push Updated Social State & Logs
        run: |
          git config --global user.name "Foresight Social Bot"
          git config --global user.email "social-bot@fhinspectionsatl.com"
          git add data/social-logs/ data/
          git diff --cached --quiet || (git commit -m "chore(social): manual LinkedIn copy rotation [skip ci]" && git pull --rebase -X theirs origin main && git push origin main) || echo "No state changes to commit."
