name: Autonomous 3-Tier Social & GBP Failover Engine (PC1 -> PC2 -> 24/7 Cloud)

on:
  schedule:
    # Runs daily at 11:35 AM EST (16:35 UTC) — 65 min after Primary PC (10:30 AM)
    # and 30 min after Standby PC #2 (11:05 AM). Stands down if either PC published today!
    - cron: '35 16 * * *'
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  broadcast-social-post:
    name: Tier-3 Cloud Social & GBP Failover (When Both PCs Are Offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Tier-3 Cloud Failover When Both Local PCs Are Offline
        env:
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: node scripts/pc2-social-failover-publisher.mjs --slot=morning --headless-only

      - name: Commit and Push Updated Failover State & Logs
        run: |
          git config --global user.name "Foresight Social Bot"
          git config --global user.email "social-bot@fhinspectionsatl.com"
          git add data/social-logs/ data/chief-of-staff-social-status.json
          git diff --cached --quiet || (git commit -m "chore(social): automated Tier-3 cloud social failover sync [skip ci]" && git pull --rebase -X theirs origin main && git push origin main) || echo "No state changes to commit."
