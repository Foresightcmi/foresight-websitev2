name: Monday — Technical SEO Health Guard

on:
  schedule:
    # 13:00 UTC = 9:00 AM EST (Every Monday)
    - cron: '0 13 * * 1'
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit-and-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SEO Technical Health Check
        run: node scripts/seo-health-check.mjs

      - name: Commit and Push SEO Moat Refinements
        run: |
          git config user.name "Foresight SEO Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/ public/
          git diff --cached --quiet || (git commit -m "chore(seo): weekly automated technical health sync [skip ci]" && git pull --rebase -X theirs origin main && git push origin main) || echo "SEO records clean or push bypassed."
