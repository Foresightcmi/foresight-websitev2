name: Monday — Technical SEO Health & SearchAgent OS Dominance Guard

on:
  schedule:
    # 13:00 UTC = 9:00 AM EST (Every Monday)
    - cron: '0 13 * * 1'
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit-and-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Closed-Loop Autonomous SEO Governor (GSC + GA4 + Core Update Gate)
        env:
          GCP_SA_JSON: ${{ secrets.GCP_ANALYTICS_SA_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'fores-antigravity-alerts-77' }}
        run: |
          python3 -m pip install --quiet --break-system-packages google-auth httpx || pip install --quiet google-auth httpx
          if [ -n "$GCP_SA_JSON" ]; then
            printf '%s' "$GCP_SA_JSON" > .analytics/service-account.json
          fi
          python3 .agents/skills/traffic-intelligence/scripts/autonomous_seo_governor.py --workspace . govern --ntfy-topic "$NTFY_TOPIC"
          rm -f .analytics/service-account.json

      - name: Run FirstIndex Truth Document Guard & Auto-Healer
        run: node scripts/firstindex-truth-guard.mjs --fix

      - name: Run SEO Technical Health Check
        run: node scripts/seo-health-check.mjs

      - name: Run SearchAgent OS (Bot 1 Answer Radar, Bot 4 Source Map, Bot 5 Signal)
        run: node scripts/search-agent-os.mjs

      - name: Run Bot 2 GSC Leak Hunter, Competitor Scorecard & SEO-Social Agency Engine
        run: |
          node scripts/gsc-leak-hunter-engine.mjs
          node scripts/striking-distance-engine.mjs
          node scripts/live-analytics-pseo-sync.mjs
          node scripts/auto-heal-intent-mismatches.mjs
          node scripts/sync-ecosystem-harmony.mjs
          node scripts/heytony-competitor-watchdog.mjs
          node scripts/gbp-gap-and-ai-agent-audit.mjs
          node scripts/chameleonic-competitor-matrix.mjs
          node scripts/foresight-seo-social-agency.mjs
          node scripts/audit-youtube-growth-system.mjs
          node scripts/firstindex-truth-guard.mjs --fix
          node scripts/seo-health-check.mjs
          python3 scripts/page1-guard.py

      - name: Commit and Push SEO Moat Refinements
        run: |
          git config user.name "Foresight SEO Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/ public/ docs/youtube-growth-swarm/ .analytics/experiments_ledger.jsonl
          git diff --cached --quiet || (git commit -m "chore(seo): weekly automated SearchAgent OS, SEO Governor & truth sync [skip actions]" && git pull --rebase -X theirs origin main && git push origin main) || echo "SEO records clean or push bypassed."
