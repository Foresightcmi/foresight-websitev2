name: Sunday — Keyword Discovery, Ecosystem Harmony & Rank Math Audit

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC (10:00 PM EST Saturday)
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-seo-agents:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Keyword Discovery Agent
      run: node scripts/discover-keywords.mjs

    - name: Run Unified Ecosystem Harmony & Truth Sync
      run: node scripts/sync-ecosystem-harmony.mjs

    - name: Run FirstIndex Truth & Persona Guard
      run: node scripts/firstindex-truth-guard.mjs

    - name: Run Native Rank Math & TruSEO Audit Engine
      run: node scripts/rankmath-audit-engine.mjs

    - name: Run SERP Simulator (Desktop & Mobile Pixel Check)
      run: node scripts/serp-preview-simulator.mjs

    - name: Commit and Push Updated Audit & Keyword Files
      run: |
        git config --global user.name "Foresight SEO Bot"
        git config --global user.email "seo-bot@fhinspectionsatl.com"
        git add data/
        git diff --cached --quiet || (git commit -m "chore(seo): automated Sunday keyword discovery, ecosystem harmony & Rank Math audit" && git pull --rebase -X theirs origin main && git push origin main) || echo "No changes to commit."

    - name: Run Search Engine Pinger (IndexNow & Google)
      run: node scripts/ping-indexnow.mjs
