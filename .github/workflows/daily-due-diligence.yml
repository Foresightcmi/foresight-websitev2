name: Autonomous Daily Due Diligence & Loan Officer Scouting Engine

on:
  schedule:
    # Twice daily inside 9 AM - 6 PM Eastern year-round (14:30 UTC & 19:30 UTC)
    - cron: '30 14,19 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  scout-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan Inbox for Opt-Out Replies Before Sending
        run: node scripts/cloud-imap-unsubscribe-guard.mjs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER || 'inspect@foresightcmi.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Execute Autonomous Due Diligence & Loan Officer Scout
        run: node scripts/autonomous-due-diligence-engine.mjs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER || 'inspect@foresightcmi.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Regenerate & Deploy Top 150 Brand-New VIP Due Diligence Dispatcher
        run: node scripts/generate-due-diligence-dispatch.mjs

      - name: Commit and Push Outreach Logs & VIP Dispatcher
        run: |
          git config user.name "Foresight Scout Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add public/vip-dispatch.html data/unsubscribed_contacts.json data/due-diligence-outreach-log.json data/loan-officers.json data/under-contract-realtors.json data/archive-under-contract-realtors.json
          git diff --cached --quiet || (git commit -m "chore(due-diligence): daily due diligence scout and vip-dispatch sync [skip ci]" && git pull --rebase origin main && git push origin main) || echo "Outreach logs clean or push bypassed."

