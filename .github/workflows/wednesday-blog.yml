name: Wednesday — Blog Writer

on:
  schedule:
    # Every Wednesday at 10:00 AM EST (14:00 UTC)
    - cron: '0 14 * * 3'
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate blog post from keyword brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit, push, and ping IndexNow
        run: |
          git config user.name "Foresight Blog Writer"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/posts.json
          if ! git diff --cached --quiet; then
            git commit -m "blog: new post $(date +%Y-%m-%d) [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin main
            node scripts/ping-indexnow.mjs
          else
            echo "Clean"
          fi
