name: Wednesday — Blog Writer

on:
  schedule:
    # Every Wednesday at 10:00 AM EST (14:00 UTC)
    - cron: '0 14 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate blog post from keyword brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      - name: Ping Google Sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://www.fhinspectionsatl.com/sitemap.xml"
          echo "Google sitemap pinged"

      - name: Commit and push
        run: |
          git config user.name "Foresight Blog Writer"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/posts.json
          git diff --cached --quiet || (git commit -m "blog: new post $(date +%Y-%m-%d)" && git push)
