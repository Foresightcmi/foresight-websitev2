name: Sunday — Index Pinger

on:
  schedule:
    # Every Sunday at 8:00 AM EST (12:00 UTC) — weekly wrap-up ping
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ping all search engines
        run: node scripts/ping-indexnow.mjs
