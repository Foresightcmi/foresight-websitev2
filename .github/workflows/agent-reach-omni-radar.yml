name: Foresight Agent-Reach Twice-Daily Omni-Medium Demand Radar

on:
  schedule:
    # Twice Daily: 11:30 UTC (07:30 AM EDT) & 16:30 UTC (12:30 PM EDT)
    # Single authoritative runner (local duplicate Windows Task retired).
    - cron: '30 11,16 * * *'
  workflow_dispatch:

concurrency:
  group: foresight-main-branch-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent-reach-omni-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Agent-Reach v1.6.0 & yt-dlp ($0 Public-Web Mode)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install git+https://github.com/Panniantong/Agent-Reach.git
          uv tool install yt-dlp

      - name: Install dependencies
        run: npm ci

      - name: Run Twice-Daily 10-Medium Demand & YouTube Realtor Radar
        env:
          AGENT_REACH_BIN: /home/runner/.local/bin/agent-reach
          YT_DLP_BIN: /home/runner/.local/bin/yt-dlp
        run: node scripts/agent-reach-omni-radar.mjs --push

      - name: Commit & Push Verified Omni-Medium Intelligence
        run: |
          git config user.name "Foresight Omni-Radar Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/
          git diff --cached --quiet || (git commit -m "chore(radar): twice-daily Agent-Reach 10-medium demand intel sync [skip ci]" && git pull --rebase -X theirs origin main && git push origin main) || echo "Clean"
