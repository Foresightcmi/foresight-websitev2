name: Autonomous New Construction Radar & Advisory Engine

on:
  schedule:
    # Run every day at 12:00 UTC (8:00 AM EST)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  harvest-and-outreach:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Harvest Metro Atlanta New Construction Leads
        run: node scripts/new-construction-radar.mjs

      - name: Generate New Construction Due Diligence Dossiers
        run: node scripts/generate-new-construction-dossiers.mjs

      - name: Dispatch New Construction Outreach & Hot Sheet
        run: node scripts/new-construction-outreach.mjs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER || 'inspect@foresightcmi.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Commit and Push Updated Leads, Dossiers & Hot Sheets
        run: |
          git config user.name "Foresight Revenue Radar Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/ public/dossiers/
          git diff --cached --quiet || (git commit -m "chore(radar): automated metro atlanta new construction harvest and dossiers [skip ci]" && git push)
