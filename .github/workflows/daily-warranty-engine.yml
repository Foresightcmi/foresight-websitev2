name: Autonomous 11-Month Warranty Email Dispatcher

on:
  schedule:
    # 14:45 UTC = 10:45 AM EDT / 9:45 AM EST (Daily inside 9 AM - 6 PM Eastern)
    - cron: '45 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch-warranty-dossiers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Autonomous 11-Month Warranty Dispatch Engine
        run: node scripts/autonomous-warranty-email-engine.mjs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER || 'inspect@foresightcmi.com' }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

      - name: Commit and Push Outreach Logs & CRM Updates
        run: |
          git config user.name "Foresight Warranty Bot"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/warranty-outreach-log.json data/warranty-tracker-crm.json public/warranty-dispatch.html
          git diff --cached --quiet || (git commit -m "chore(warranty): autonomous 11-month warranty outreach dispatch [skip ci]" && git pull --rebase origin main && git push origin main) || echo "Warranty records clean or push bypassed."
