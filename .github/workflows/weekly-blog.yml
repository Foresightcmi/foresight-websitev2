name: Monday — Keyword Scout

on:
  schedule:
    # Every Monday at 9:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover trending keywords
        run: node scripts/discover-keywords.mjs

      - name: Commit keyword brief
        run: |
          git config user.name "Foresight Keyword Scout"
          git config user.email "bot@fhinspectionsatl.com"
          git add data/keyword-brief.json
          git diff --cached --quiet || (git commit -m "research: keyword discovery $(date +%Y-%m-%d)" && git push)
